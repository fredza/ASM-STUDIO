[package]
name = "asm_studio"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "IDE pédagogique pour apprendre l'assembleur NASM x86-64 (registres, flags, pile, mémoire, mode explication)"
authors = ["Frederic Z"]

[dependencies]
eframe = "0.29"
nix = { version = "0.29", features = ["ptrace", "process", "signal"] }
libc = "0.2"
capstone = "0.12"
object = "0.36"
# Dialogues fichiers natifs via le portail XDG (GNOME/Wayland), sans GTK.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
