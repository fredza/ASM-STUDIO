[package]
name = "asm_studio"
version = "0.4.9-beta.1"
edition = "2024"
# Licence propre au projet, hors nomenclature SPDX : le fichier fait foi.
license-file = "LICENSE.md"
description = "IDE pédagogique pour apprendre l'assembleur NASM x86-64 (registres, flags, pile, mémoire, mode explication)"
authors = ["Frederic Z"]

# Binaire de distribution : c'est celui que l'élève télécharge, et il embarque
# capstone, egui et tout le catalogue de leçons. Ces réglages, avec la
# restriction de capstone au seul x86, le ramènent de 22,8 à 12,4 Mo — au prix
# d'une compilation de deux minutes, qui ne concerne que les publications.
#
# `panic = "abort"` gagnerait encore 1,4 Mo mais n'est PAS retenu : les
# dialogues fichiers et la vérification de mise à jour tournent sur des threads
# de fond, où un panic (rfd, ureq, serde_json) se contente aujourd'hui de tuer
# le thread. En abort il emporterait l'IDE, et avec lui le source que l'élève
# n'a pas encore enregistré.
[profile.release]
# `fat` plutôt que `thin` : 1,4 Mo de moins, pour quatre fois plus de temps de
# compilation. Le marché est bon quand on ne compile qu'à la publication.
lto = "fat"
codegen-units = 1
strip = true
# Optimisation pour la taille : 1,9 Mo de moins contre un pas-à-pas à 13,9 µs
# au lieu de 11,4 (mesure `bench_forty_thousand_steps`). Le seul cas où ça se
# voit est un « Continuer » qui épuise tout son budget, et il reste sous la
# seconde et demie.
opt-level = "s"

[dependencies]
eframe = "0.33"
nix = { version = "0.31", features = ["ptrace", "process", "signal"] }
libc = "0.2"
# Une seule architecture : par défaut capstone compile les dix-huit qu'il
# connaît (ARM, MIPS, PowerPC, SPARC…), soit des mégaoctets de tables inutiles
# ici — ASM Studio ne désassemble que du x86-64. « full » reste indispensable :
# sans lui, capstone est bâti en mode « diet », sans les mnémoniques en clair,
# et le panneau de désassemblage n'aurait plus rien à afficher.
capstone = { version = "0.14", default-features = false, features = ["full", "std", "arch_x86"] }
# « write » n'est pas dans les features par défaut : il sert au lieur PE
# (src/pe_link.rs), qui produit l'exécutable Windows sans outil externe — ni
# lld-link, ni les bibliothèques d'import du SDK Microsoft, introuvables sur la
# machine d'un élève sous Linux. Coût mesuré sur le binaire de distribution :
# environ 90 Ko.
object = { version = "0.40", features = ["write"] }
# Dialogues fichiers natifs via le portail XDG (GNOME/Wayland), sans GTK.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Pilote le futur AsyncFileDialog sur un thread de fond (bloque ce thread, pas l'UI).
pollster = "1"
# Mise à jour automatique : client HTTP synchrone léger + parseur JSON minimal.
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_dock = "0.18"
base64 = "0.22"
# Lecture du presse-papiers (bouton « Coller » de la boîte d'activation). egui
# sait écrire dans le presse-papiers mais pas le lire : il n'expose le collage
# que par l'événement clavier, ce qui ne permet pas de le déclencher depuis un
# bouton. arboard est déjà là — eframe s'en sert en interne — donc la
# dépendance directe ne coûte rien au binaire.
arboard = { version = "3", default-features = false }
ed25519-dalek = "2"
